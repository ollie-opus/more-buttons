<form data-nav data-dirty-guard id="edit-grid-form" data-storage-key="moreButtonsEditGrid" data-width="90vw" data-height="90vh">
  <h2 data-grid-heading>Edit grid</h2>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Style</label>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn"><input type="radio" name="gridFlavor" value="generic" /> Plain</label>
      <label class="more-buttons-radio-btn"><input type="radio" name="gridFlavor" value="card" /> Cards</label>
    </div>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Cells</label>
    <div>
      <div data-grid-cells></div>
    </div>
  </div>

  <input type="hidden" name="gridState" />

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button success" data-action="submitEditGrid" data-save-state data-saved-label="Draft saved" data-unsaved-label="Save to draft"><span class="more-buttons-icon">save</span>Save to draft</button>
    <button type="button" class="more-buttons-button danger" data-action="deleteGrid" data-delete-grid-btn><span class="more-buttons-icon">delete</span>Delete</button>
  </div>
</form>
