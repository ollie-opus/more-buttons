<form data-nav id="create-guide-form" data-storage-key="moreButtonsCreateGuide" data-width="90vw" data-height="90vh">
  <h2>Create a new guide</h2>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Title</label>
    <input type="text" name="guideTitle" required placeholder="Registering an employee" />
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Path</label>
    <div class="mb-path-field">
      <input type="text" name="guidePath" required placeholder="guides/employees" />
      <span class="mb-path-suffix" data-path-suffix>/…md</span>
    </div>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Icon</label>
    <input type="text" name="icon" placeholder="Search lucide icons…" autocomplete="off" />
  </div>

  <div class="more-buttons-form-group">
    <div>
      <label class="more-buttons-label">Written for</label>
      <div class="more-buttons-label-hint">Which OCC users this page is written for</div>
    </div>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn --label-blue"><input type="radio" name="writtenFor" value="users" required /> Users and above</label>
      <label class="more-buttons-radio-btn --label-purple"><input type="radio" name="writtenFor" value="managers" /> Managers and above</label>
      <label class="more-buttons-radio-btn --label-pink"><input type="radio" name="writtenFor" value="admins" /> Administrators only</label>
      <label class="more-buttons-radio-btn --grey"><input type="radio" name="writtenFor" value="none" /> N/A</label>
    </div>
  </div>

  <div class="more-buttons-form-group">
    <div>
      <label class="more-buttons-label">Tags</label>
      <div class="more-buttons-label-hint">Group related pages, e.g. System, Contractors</div>
    </div>
    <input type="text" name="tags" data-tag-chips autocomplete="off" />
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Hide elements</label>
    <div class="more-buttons-radio-group-column">
      <label class="more-buttons-sub-label">
        <input type="checkbox" name="hideNavigation" value="navigation" />
        Navigation
      </label>
      <label class="more-buttons-sub-label">
        <input type="checkbox" name="hideToc" value="toc" />
        Table of Contents
      </label>
      <label class="more-buttons-sub-label">
        <input type="checkbox" name="hidePath" value="path" />
        Path
      </label>
      <label class="more-buttons-sub-label">
        <input type="checkbox" name="hideWrittenFor" value="written-for" />
        Written for
      </label>
    </div>
  </div>

  <div class="more-buttons-form-group">
    <div>
      <label class="more-buttons-label">Page visibility</label>
      <div class="more-buttons-label-hint">Unlisted pages stay reachable by link but leave the site navigation and search</div>
    </div>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn --green"><input type="radio" name="visibility" value="public" required /> Public</label>
      <label class="more-buttons-radio-btn --grey"><input type="radio" name="visibility" value="unlisted" /> Unlisted</label>
    </div>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button" data-action="submitCreateGuide" data-validate><span class="more-buttons-icon">add</span>Create draft</button>
  </div>
</form>
