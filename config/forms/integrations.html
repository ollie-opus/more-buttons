<!-- Hub only — no named inputs, no save action, so the storage key is never
     written; it exists because a form WITHOUT one routes through the formless
     dispatcher, which tears down history before opening a child and would
     permanently break the child forms' back arrow. -->
<form id="integrations-hub-form" data-storage-key="moreButtonsIntegrationsHub" data-nav data-width="560px">
  <h2>Integrations</h2>

  <p class="more-buttons-description">Connect the services More Buttons uses.</p>

  <div class="mb-integration-tiles">
    <button type="button" class="mb-adm-empty mb-integration-tile" data-action="openGithubIntegration">
      <span class="mb-adm-empty__icon more-buttons-icon">code</span>
      <span>GitHub</span>
      <span class="mb-integration-status" data-integration-status="github">…</span>
    </button>
    <button type="button" class="mb-adm-empty mb-integration-tile" data-action="openGeminiIntegration">
      <span class="mb-adm-empty__icon more-buttons-icon">auto_awesome</span>
      <span>Google Gemini</span>
      <span class="mb-integration-status" data-integration-status="gemini">…</span>
    </button>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button secondary" data-action="close"><span class="more-buttons-icon">close</span>Close</button>
  </div>
</form>
