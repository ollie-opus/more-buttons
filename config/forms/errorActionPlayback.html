<div data-width="560px">
  <h2><span class="more-buttons-icon" style="color: #ef4444; font-size: 1.5rem">circle-alert</span> Action stopped</h2>

  <p class="more-buttons-description" data-error-summary></p>

  <div class="more-buttons-list mb-action-error" data-failed-list></div>

  <div data-played-wrap hidden>
    <p class="more-buttons-description">Steps that did run:</p>
    <div class="more-buttons-list mb-action-error" data-played-list></div>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button" data-action="close"><span class="more-buttons-icon">x</span>Close</button>
  </div>
</div>
