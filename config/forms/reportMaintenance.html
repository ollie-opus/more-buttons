<form data-nav id="report-maintenance-form" data-storage-key="moreButtonsReportMaintenance" data-width="90vw" data-height="90vh">
  <h2><span class="more-buttons-icon">build</span> Report Maintenance</h2>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Service(s) Affected</label>
    <div id="report-maintenance-services" class="more-buttons-radio-btn-group-row">
      <!-- dynamically injected by openReportMaintenance -->
    </div>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Description</label>
    <textarea name="description" rows="2" placeholder="What is being worked on, and what should users expect?"></textarea>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Scheduled Start</label>
    <input type="datetime-local" name="scheduledStart" />
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Scheduled End</label>
    <input type="datetime-local" name="scheduledEnd" />
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button publish" data-action="submitReportMaintenance"><span class="more-buttons-icon">verified</span>Publish Maintenance</button>
  </div>
</form>
