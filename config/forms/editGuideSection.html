<form data-nav data-dirty-guard id="edit-guide-section-form" data-storage-key="moreButtonsEditGuideSection" data-width="90vw" data-height="90vh">
  <div class="mb-ident">
    <input type="text" name="sectionTitle" class="mb-ident__title" required placeholder="Section title" aria-label="Title" />
    <label class="more-buttons-radio-btn" title="Hide this title in the published guide (the section still appears)"><input type="checkbox" name="hideSectionTitle" /><span class="more-buttons-icon">eye-off</span>Hide title</label>
    <span class="mb-ident__pills" data-guide-section-heading></span>
  </div>

  <div class="more-buttons-form-group" data-section-parent-row>
    <label class="more-buttons-label">Section parent</label>
    <select name="sectionParent" data-section-parent-select></select>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Description</label>
    <textarea name="sectionDescription" rows="6" data-richtext placeholder="Markdown allowed — lists, defn lists, etc."></textarea>
  </div>

  <div class="more-buttons-form-group" data-components-row data-list-row>
    <label class="more-buttons-label">Components</label>
    <div>
      <div data-section-components></div>
    </div>
  </div>
  <input type="hidden" name="componentOrder" />

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button green" data-action="submitEditGuideSection" data-validate data-save-state data-saved-label="Draft saved" data-unsaved-label="Save to draft"><span class="more-buttons-icon">save</span>Save to draft</button>
    <button type="button" class="more-buttons-button red" data-action="deleteGuideSection" data-delete-section-btn><span class="more-buttons-icon">trash-2</span>Delete</button>
  </div>
</form>
