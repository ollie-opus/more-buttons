<div data-width="480px">
  <h2><span class="more-buttons-icon" style="font-size: 1.5rem">circle-play</span> Play action</h2>

  <div data-play-ready hidden>
    <p class="more-buttons-description">Play <strong data-action-name></strong> (<span data-step-count></span>) on this page?</p>
    <p class="more-buttons-description">Tip: hold Ctrl or Cmd while clicking the dock button to skip this confirmation.</p>
  </div>

  <div data-play-none hidden>
    <p class="more-buttons-description">No action is active. Open <strong>Manage saved actions</strong> and set one active first.</p>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button green" data-action="runActiveAction" data-play-btn><span class="more-buttons-icon">play</span>Play</button>
    <button type="button" class="more-buttons-button" data-action="openManageActions" data-manage-btn><span class="more-buttons-icon">list-video</span>Manage</button>
    <button type="button" class="more-buttons-button" data-action="close"><span class="more-buttons-icon">x</span>Cancel</button>
  </div>
</div>
