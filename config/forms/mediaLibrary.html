<!-- Storage key keeps the legacy "CaptureLibrary" name so saved window geometry survives the rename. -->
<form data-nav id="media-library-form" data-storage-key="moreButtonsCaptureLibrary" data-width="90vw" data-height="90vh">
  <h2>Media Library</h2>
  <div class="more-buttons-tabs">
    <div class="more-buttons-tab-list" data-media-library-tabs></div>
    <div class="more-buttons-tab-panel" data-media-library-panel></div>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button" data-action="startLibraryCapture"><span class="more-buttons-icon">add</span>Create new capture</button>
    <button type="button" class="more-buttons-button" data-action="startLibraryUpload"><span class="more-buttons-icon">upload</span>Upload a new file</button>
  </div>
</form>
