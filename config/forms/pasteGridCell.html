<form data-nav id="paste-grid-cell-form" data-storage-key="moreButtonsPasteGridCell" data-width="90vw" data-height="90vh">
  <h2>Paste cell markdown</h2>

  <div class="more-buttons-form-group more-buttons-form-group--full">
    <textarea name="pasteMarkdownText" rows="18" aria-label="Pasted cell markdown" placeholder="Paste markdown copied with a cell’s Copy button, or a whole grid"></textarea>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button success" data-action="insertPastedGridCells"><span class="more-buttons-icon">add</span>Insert cell</button>
  </div>
</form>
