<form id="ask-at-play-form" data-storage-key="moreButtonsAskAtPlay" data-width="520px">
  <h2>Before playing “<span data-action-name></span>”</h2>

  <p class="more-buttons-description">These steps were recorded without a value (password fields, or steps you marked <strong>ask at play</strong>). Enter them for this run only; they are never saved to the library.</p>

  <div data-ask-fields></div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button green" data-action="submitAskAtPlay" data-validate><span class="more-buttons-icon">play</span>Play</button>
    <button type="button" class="more-buttons-button" data-action="close"><span class="more-buttons-icon">x</span>Cancel</button>
  </div>
</form>
