<form id="action-name-form" data-storage-key="moreButtonsActionNamePrompt" data-width="480px">
  <h2>Name this action</h2>

  <p class="more-buttons-description">Recorded <strong data-step-count>0 steps</strong>. Give the action a name so you can find it in the library.</p>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label" for="action-name-input">Name</label>
    <input id="action-name-input" class="more-buttons-input-text" type="text" name="actionName" required data-maxlength="60" placeholder="e.g. Create test employee" autocomplete="off" />
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button green" data-action="submitActionName" data-validate><span class="more-buttons-icon">save</span>Save action</button>
    <button type="button" class="more-buttons-button red" data-action="discardRecording"><span class="more-buttons-icon">trash-2</span>Discard</button>
  </div>
</form>
