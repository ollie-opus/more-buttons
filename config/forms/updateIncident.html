<form data-nav id="update-incident-form" data-storage-key="moreButtonsUpdateIncident" data-width="90vw" data-height="90vh">
  <h2>Update Incident</h2>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Service(s) Affected</label>
    <div id="update-incident-services" class="more-buttons-radio-btn-group-row">
      <!-- dynamically injected by openUpdateIncident / openEditPastIncident -->
    </div>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Service Impact</label>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn --amber"><input type="radio" name="impact" value="disruption" required /> Disruption</label>
      <label class="more-buttons-radio-btn --red"><input type="radio" name="impact" value="outage" required /> Outage</label>
    </div>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Reported</label>
    <input type="datetime-local" name="reported" />
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Description</label>
    <textarea name="description" rows="2"></textarea>
  </div>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Current Status</label>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn --amber"><input type="radio" name="currentStatus" value="ongoing" /> Ongoing</label>
      <label class="more-buttons-radio-btn --green"><input type="radio" name="currentStatus" value="resolved" /> Resolved</label>
    </div>
  </div>

  <div class="more-buttons-form-group" data-show-when="currentStatus=resolved">
    <label class="more-buttons-label">Resolved</label>
    <input type="datetime-local" name="resolved" />
  </div>

  <div class="more-buttons-form-group" data-show-when="currentStatus=resolved">
    <label class="more-buttons-label">Causation</label>
    <textarea name="causation" rows="2" placeholder="What caused the incident?"></textarea>
  </div>

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button green" data-validate data-action="submitUpdateIncident"><span class="more-buttons-icon">badge-check</span>Save & Publish</button>
    <button type="button" class="more-buttons-button red" data-action="deleteIncident"><span class="more-buttons-icon">trash-2</span>Delete</button>
  </div>
</form>
