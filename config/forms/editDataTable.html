<form data-nav data-dirty-guard id="edit-data-table-form" data-storage-key="moreButtonsEditDataTable" data-width="90vw" data-height="90vh">
  <h2 data-dt-heading>Edit data table</h2>

  <div class="more-buttons-form-group">
    <label class="more-buttons-label">Text wrapping</label>
    <div class="more-buttons-radio-btn-group-row">
      <label class="more-buttons-radio-btn"><input type="radio" name="textWrap" value="enabled" /> Enabled</label>
      <label class="more-buttons-radio-btn"><input type="radio" name="textWrap" value="disabled" /> Disabled</label>
    </div>
  </div>

  <!-- Rich-text controls for the active cell. The upgraded RTE's editing
       nodes (surface + textarea) are moved into the grid cell being edited;
       parked here (hidden) otherwise. Unnamed on purpose: the single named
       tableState input below is the only dirty-tracking value. -->
  <div class="mb-dt-toolbar" data-dt-toolbar>
    <textarea data-dt-cell-editor rows="1" data-richtext="inline"></textarea>
  </div>

  <div class="mb-dt-grid-wrap" data-dt-grid-wrap tabindex="0" role="grid" aria-label="Data table">
    <table class="mb-dt-grid" data-dt-grid></table>
  </div>

  <input type="hidden" name="tableState" />

  <div class="more-buttons-form-actions">
    <button type="button" class="more-buttons-button success" data-action="submitEditDataTable" data-save-state data-saved-label="Draft saved" data-unsaved-label="Save to draft"><span class="more-buttons-icon">save</span>Save to draft</button>
    <button type="button" class="more-buttons-button danger" data-action="deleteDataTable" data-delete-table-btn><span class="more-buttons-icon">delete</span>Delete</button>
  </div>
</form>
